<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem Regressiva - 13º</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

        body {
            background: linear-gradient(135deg, #1b2735 0%, #090a0f 100%);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .countdown {
            display: flex;
            gap: 1rem;
            font-size: 1.2rem;
        }

        .countdown div {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1rem 1.5rem;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }

        .countdown span {
            display: block;
            font-size: 2.5rem;
            font-weight: 600;
            color: #00ff99;
        }

        .message {
            display: none;
            font-size: 2.2rem;
            font-weight: bold;
            color: #00ff99;
            margin-top: 2rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }

        footer {
            position: absolute;
            bottom: 15px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>

<body>

    <h1>Contagem Regressiva para a 1ª Parcela do 13º 💰</h1>

    <div class="countdown" id="countdown">
        <div><span id="days">00</span>Dias</div>
        <div><span id="hours">00</span>Horas</div>
        <div><span id="minutes">00</span>Min</div>
        <div><span id="seconds">00</span>Seg</div>
    </div>

    <div class="message" id="message">Tá na conta 💸</div>

    <footer>Atualizado automaticamente</footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const countdownEl = document.getElementById("countdown");
            const messageEl = document.getElementById("message");

            // Data da primeira parcela
            const targetDate = new Date("2025-11-30T00:00:00").getTime();

            const interval = setInterval(() => {
                const now = new Date().getTime();
                const distance = targetDate - now;

                if (distance <= 0) {
                    clearInterval(interval);
                    countdownEl.style.display = "none";
                    messageEl.style.display = "block";
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById("days").textContent = days.toString().padStart(2, "0");
                document.getElementById("hours").textContent = hours.toString().padStart(2, "0");
                document.getElementById("minutes").textContent = minutes.toString().padStart(2, "0");
                document.getElementById("seconds").textContent = seconds.toString().padStart(2, "0");
            }, 1000);
        });
    </script>

</body>

</html>
