<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem Regressiva - 13º</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

        body {
            background: linear-gradient(135deg, #1b2735 0%, #090a0f 100%);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 2rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .countdown-container {
            display: flex;
            gap: 3rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .countdown {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 1.5rem;
            backdrop-filter: blur(6px);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
            min-width: 200px;
        }

        .countdown h2 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
        }

        .time-box {
            display: flex;
            justify-content: space-between;
            font-size: 1.1rem;
        }

        .time-box div span {
            display: block;
            font-size: 2rem;
            font-weight: 600;
            color: #00ff99;
        }

        .message {
            display: none;
            font-size: 1.8rem;
            font-weight: bold;
            color: #00ff99;
            margin-top: 1rem;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.8;
            }
        }

        footer {
            position: absolute;
            bottom: 15px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>

<body>

    <h1>Contagem Regressiva para o 13º 💰</h1>

    <div class="countdown-container">

        <div class="countdown" id="parcel1">
            <h2>1ª Parcela</h2>
            <div class="time-box">
                <div><span id="days1">00</span>D</div>
                <div><span id="hours1">00</span>H</div>
                <div><span id="minutes1">00</span>M</div>
                <div><span id="seconds1">00</span>S</div>
            </div>
            <div class="message" id="message1">1ª parcela na conta 💸</div>
        </div>

        <div class="countdown" id="parcel2">
            <h2>2ª Parcela</h2>
            <div class="time-box">
                <div><span id="days2">00</span>D</div>
                <div><span id="hours2">00</span>H</div>
                <div><span id="minutes2">00</span>M</div>
                <div><span id="seconds2">00</span>S</div>
            </div>
            <div class="message" id="message2">2ª parcela na conta 💸</div>
        </div>

    </div>

    <footer>Atualizado automaticamente</footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Datas das parcelas
            const parcels = [
                {
                    date: new Date("2025-11-30T00:00:00").getTime(), elements: {
                        days: "days1", hours: "hours1", minutes: "minutes1", seconds: "seconds1", message: "message1", container: "parcel1"
                    }
                },
                {
                    date: new Date("2025-12-20T00:00:00").getTime(), elements: {
                        days: "days2", hours: "hours2", minutes: "minutes2", seconds: "seconds2", message: "message2", container: "parcel2"
                    }
                }
            ];

            parcels.forEach(parcel => {
                const interval = setInterval(() => {
                    const now = new Date().getTime();
                    const distance = parcel.date - now;

                    if (distance <= 0) {
                        clearInterval(interval);
                        document.getElementById(parcel.elements.container).querySelector(".time-box").style.display = "none";
                        document.getElementById(parcel.elements.message).style.display = "block";
                        return;
                    }

                    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                    document.getElementById(parcel.elements.days).textContent = String(days).padStart(2, "0");
                    document.getElementById(parcel.elements.hours).textContent = String(hours).padStart(2, "0");
                    document.getElementById(parcel.elements.minutes).textContent = String(minutes).padStart(2, "0");
                    document.getElementById(parcel.elements.seconds).textContent = String(seconds).padStart(2, "0");
                }, 1000);
            });
        });
    </script>

</body>

</html>
